name: import-results

# Триггер: в репозиторий попал архив с результатами прогона Colab.
# Что делает: распаковывает, пересчитывает метрики, обновляет отчёт, графики,
# сверку с числами статьи и README, затем коммитит результат обратно в ветку.
on:
  push:
    paths:
      - "incoming/*.zip"
      - "colab_outputs_*.zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-reports:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install report dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn matplotlib python-pptx

      - name: Show incoming archives
        run: ls -la incoming/ 2>/dev/null; ls -la colab_outputs_*.zip 2>/dev/null || true

      - name: Build reports from archives
        run: |
          # Удаление архивов после импорта пока ОТКЛЮЧЕНО (режим отладки).
          # Когда цепочка будет обкатана — добавить флаг --delete-zip:
          # python scripts/build_reports.py --delete-zip
          python scripts/build_reports.py --skip-pptx

      - name: Show what changed
        run: git status --short

      - name: Commit updated reports
        if: ${{ !env.ACT }}
        run: |
          git add -A -- README.md results figures
          if git diff --cached --quiet; then
            echo "изменений нет"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Авто-сборка отчётов из архива прогона [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - uses: actions/upload-artifact@v6
        if: ${{ !env.ACT }}
        with:
          name: reports
          path: |
            README.md
            results/**
            figures/**
          if-no-files-found: warn
